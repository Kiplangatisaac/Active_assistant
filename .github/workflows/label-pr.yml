name: "Pull Request Labeler"

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Apply PR Labels (based on file changes)
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false

      - name: Label based on PR title prefix
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const mapping = {
              '^feat(\\(.*\\))?:': 'feat',
              '^fix(\\(.*\\))?:': 'fix',
              '^docs(\\(.*\\))?:': 'docs',
              '^perf(\\(.*\\))?:': 'performance',
              '^refactor(\\(.*\\))?:': 'refactor',
              '^chore(\\(.*\\))?:': 'chore',
              '^build(\\(.*\\))?:': 'build',
              '^ci(\\(.*\\))?:': 'ci',
              '^test(\\(.*\\))?:': 'test',
              '^style(\\(.*\\))?:': 'style',
              '^revert(\\(.*\\))?:': 'revert'
            };

            const labelsToAdd = [];
            for (const [regex, label] of Object.entries(mapping)) {
              if (new RegExp(regex, 'i').test(title)) {
                labelsToAdd.push(label);
              }
            }

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: labelsToAdd
              });
            }