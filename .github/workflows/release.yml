name: Build Release Packages

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - windows
          - linux
          - macos

env:
  APP_NAME: "Active Assistant"
  APP_VERSION: "2.0.0"
  PYTHON_VERSION: "3.11"

jobs:
  # =========================================================================
  # Windows Build
  # =========================================================================
  build-windows:
    name: Build Windows (.exe)
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows' || github.event_name == 'push'
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install system dependencies
        run: |
          choco install pyinstaller --yes || pip install pyinstaller

      - name: Install Python dependencies
        run: |
          pip install -e "."

      - name: Build executable
        run: |
          python build_all.py --platform windows

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: active-assistant-windows
          path: dist/ActiveAssistant.exe
          retention-days: 7

  # =========================================================================
  # Linux Build
  # =========================================================================
  build-linux:
    name: Build Linux (tar.gz)
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux' || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            libffi-dev \
            pkg-config \
            libgtk-3-dev \
            libnotify-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            wget curl git xdg-utils

      - name: Install Python dependencies
        run: |
          pip install -e "."

      - name: Build executable
        run: |
          python build_all.py --platform linux

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: active-assistant-linux
          path: dist/active-assistant-linux.tar.gz
          retention-days: 7

  # =========================================================================
  # macOS Build
  # =========================================================================
  build-macos:
    name: Build macOS (.app)
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos' || github.event_name == 'push'
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install system dependencies
        run: |
          brew install python@3.11 openssl pkg-config libffi gtk+3 libnotify wget curl git || true
          eval "$(/opt/homebrew/bin/brew shellenv)" || true

      - name: Install Python dependencies
        run: |
          pip install -e "."

      - name: Build executable
        run: |
          python build_all.py --platform macos

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: active-assistant-macos
          path: dist/ActiveAssistant.app
          retention-days: 7

  # =========================================================================
  # Release (GitHub Release)
  # =========================================================================
  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: active-assistant-windows
          path: release-artifacts/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: active-assistant-linux
          path: release-artifacts/linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: active-assistant-macos
          path: release-artifacts/macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Active Assistant v${{ env.APP_VERSION }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release-artifacts/windows/ActiveAssistant.exe
            release-artifacts/linux/active-assistant-linux.tar.gz
            release-artifacts/macos/ActiveAssistant.app/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
