name: "Repository Settings Validator"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-settings:
    name: Check Repository Settings
    runs-on: ubuntu-latest
    steps:
      - name: Check squash merge settings
        uses: actions/github-script@v7
        with:
          script: |
            const repo = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            console.log("Repository Settings:");
            console.log(`  allow_squash_merge: ${repo.data.allow_squash_merge}`);
            console.log(`  squash_merge_commit_title: ${repo.data.squash_merge_commit_title}`);
            console.log(`  squash_merge_commit_message: ${repo.data.squash_merge_commit_message}`);
            console.log(`  allow_merge_commit: ${repo.data.allow_merge_commit}`);
            console.log(`  allow_rebase_merge: ${repo.data.allow_rebase_merge}`);
            console.log(`  delete_branch_on_merge: ${repo.data.delete_branch_on_merge}`);