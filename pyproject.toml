[project]
name = "active-assistant"
version = "2.0.0"
description = "Full-stack Active Assistant with AI vision, voice, plugins, multi-agent support, and futuristic UI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Isaac", email = "isaac@example.com"}
]
keywords = [
    "assistant", "ai", "screen-monitoring", "voice-assistant", 
    "multi-agent", "plugins", "brave-search", "computer-vision",
    "groq", "openai", "anthropic", "local-llm"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: System :: Monitoring",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core AI Providers
    "groq>=0.5.0",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "ollama>=0.2.0",
    
    # Computer Vision & Screen Capture
    "mss>=9.0.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    
    # Voice & Audio
    "speechrecognition>=3.10.0",
    "pyttsx3>=2.98",
    # "pyaudio>=0.2.13",  # Optional - requires Visual C++ Build Tools
    "vosk>=0.3.45",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    
    # Web & Search
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    
    # File Search & Multimodal (optional - install separately)
    # "clip-by-openai>=1.0.0",
    # "faiss-cpu>=1.7.4",
    # "sentence-transformers>=2.2.0",
    # "torch>=2.0.0",
    # "torchvision>=0.15.0",
    
    # UI & System Integration
    "pystray>=0.19.0",
    "plyer>=2.1.0",
    "pywin32>=306",
    "pywebview>=4.4.0",
    "customtkinter>=5.2.0",
    # "tkinter-web>=3.24.0",  # Optional - not available on PyPI
    
    # System & Utilities
    "psutil>=5.9.0",
    "watchdog>=3.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "ruamel.yaml>=0.19.0",
    "toml>=0.10.2",
    "rich>=13.0.0",
    "loguru>=0.7.0",
    
    # Plugin System
    "pluggy>=1.3.0",
    "importlib-metadata>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.5.0",
]
gpu = [
    "faiss-gpu>=1.7.4",
    "torch[cuda]>=2.0.0",
]
local-llm = [
    "llama-cpp-python>=0.2.0",
    "ctransformers>=0.2.27",
]
all = [
    "active-assistant[gpu]",
    "active-assistant[local-llm]",
]

[project.scripts]
active-assistant = "active_assistant.main:main"
active-assistant-tray = "active_assistant.tray:main"
active-assistant-ui = "active_assistant.ui.main_window:main"
active-assistant-voice = "active_assistant.voice.assistant:main"
active-assistant-setup = "active_assistant.setup:main"

[tool.pyinstaller]
spec-file = "active_assistant.spec"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"